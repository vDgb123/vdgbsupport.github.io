<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gia Bao Space - Tic Tac Toe Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #9933ff;
            --secondary: #00ffff;
            --accent: #ff00ff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient);
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            padding: 20px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .main-content {
            display: grid;
            grid-template-columns: 320px 420px 320px;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            align-items: start;
        }

        .card-glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-player {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .music-player h2 {
            font-size: 1.4rem;
            text-align: center;
            background: linear-gradient(to right, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #currentSong {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            text-align: center;
            border-bottom: 2px solid var(--secondary);
        }

        .music-controls {
            display: grid;
            gap: 10px;
        }

        .btn-music {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--glass);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
        }

        .btn-play { background: linear-gradient(45deg, var(--primary), var(--accent)); }

        .game-container {
            text-align: center;
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cell {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--glass-border);
        }

        .cell:active { transform: scale(0.9); }
        .cell.X { color: var(--accent); text-shadow: 0 0 15px var(--accent); }
        .cell.O { color: var(--secondary); text-shadow: 0 0 15px var(--secondary); }

        #restart-button {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .image-scroller {
            height: 500px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scroll-wrapper {
            flex: 1;
            overflow: hidden;
            border-radius: 15px;
            margin-top: 10px;
        }

        .scroll-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: scroll-v 15s linear infinite;
        }

        @keyframes scroll-v {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .scroll-item {
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
        }

        .scroll-item:nth-child(1), .scroll-item:nth-child(6) { background-image: url('image1.jpg'); }
        .scroll-item:nth-child(2), .scroll-item:nth-child(7) { background-image: url('image2.jpg'); }
        .scroll-item:nth-child(3), .scroll-item:nth-child(8) { background-image: url('image3.jpg'); }
        .scroll-item:nth-child(4), .scroll-item:nth-child(9) { background-image: url('image4.jpg'); }
        .scroll-item:nth-child(5), .scroll-item:nth-child(10) { background-image: url('image5.jpg'); }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
                max-width: 450px;
                padding-bottom: 50px;
            }
            
            .image-scroller { height: 350px; }
            
            .music-player { order: 2; }
            .game-container { order: 1; }
            .image-scroller { order: 3; }

            .cell { font-size: 2.5rem; }
        }

        @media (max-width: 400px) {
            padding: 10px;
            .card-glass { padding: 15px; }
            .cell { border-radius: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="card-glass music-player">
            <h2>Music Space</h2>
            <p id="currentSong">🎵 Chọn bài hát...</p>
            <div class="music-controls">
                <div style="display: flex; gap: 8px;">
                    <button class="btn-music" id="prevMusic" style="flex:1">PREV</button>
                    <button class="btn-music" id="nextMusic" style="flex:1">NEXT</button>
                </div>
                <button class="btn-music btn-play" id="playMusic">PLAY</button>
                <button class="btn-music" id="pauseMusic">PAUSE</button>
                <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <audio id="backgroundMusic" loop></audio>
        </div>

        <div class="card-glass game-container">
            <h1 style="font-size: 1.5rem; margin-bottom: 15px;">TIC TAC TOE</h1>
            <div id="status">X's Turn</div>
            <div class="game-grid" id="grid">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="restart-button">Reset Arena</button>
            <audio id="vineBoomSound" src="vineboom.mp3"></audio>
            <audio id="fartSound" src="fart.mp3"></audio>
        </div>

        <div class="card-glass image-scroller">
            <h2 style="text-align: center; font-size: 1.2rem;">Gallery</h2>
            <div class="scroll-wrapper">
                <div class="scroll-container">
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                    <div class="scroll-item"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const musicList = [
            { src: "senorita.mp3", title: "Senorita" },
            { src: "despacito.mp3", title: "Despacito" },
            { src: "rockabye.mp3", title: "Rockabye" },
            { src: "maryoncross.mp3", title: "Mary On a Cross" }
        ];

        let gameActive = true;
        let currentPlayer = "X";
        let gameState = Array(9).fill("");
        let currentSongIndex = 0;

        const winConditions = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const audio = document.getElementById('backgroundMusic');
        const statusTxt = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');
        const songDisplay = document.getElementById('currentSong');

        function loadSong(index) {
            audio.src = musicList[index].src;
            songDisplay.textContent = `🎵 ${musicList[index].title}`;
            audio.load();
        }

        function checkWinner() {
            let win = false;
            for(let condition of winConditions) {
                let [a,b,c] = condition;
                if(gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    win = true; break;
                }
            }
            if(win) {
                statusTxt.innerHTML = `${currentPlayer} Win! 🏆`;
                gameActive = false;
                document.getElementById('vineBoomSound').play();
                return;
            }
            if(!gameState.includes("")) {
                statusTxt.innerHTML = "Draw! 🤝";
                gameActive = false;
                document.getElementById('fartSound').play();
                return;
            }
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusTxt.innerHTML = `${currentPlayer}'s Turn`;
        }

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                const idx = cell.dataset.index;
                if(gameState[idx] || !gameActive) return;
                gameState[idx] = currentPlayer;
                cell.innerHTML = currentPlayer;
                cell.classList.add(currentPlayer);
                checkWinner();
            });
        });

        document.getElementById('restart-button').addEventListener('click', () => {
            gameActive = true; currentPlayer = "X"; gameState.fill("");
            statusTxt.innerHTML = "X's Turn";
            cells.forEach(c => { c.innerHTML = ""; c.classList.remove("X", "O"); });
        });

        document.getElementById('playMusic').addEventListener('click', () => audio.play());
        document.getElementById('pauseMusic').addEventListener('click', () => audio.pause());
        document.getElementById('nextMusic').addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % musicList.length;
            loadSong(currentSongIndex); audio.play();
        });
        document.getElementById('prevMusic').addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + musicList.length) % musicList.length;
            loadSong(currentSongIndex); audio.play();
        });
        document.getElementById('volumeControl').addEventListener('input', (e) => audio.volume = e.target.value);

        loadSong(currentSongIndex);
    </script>
</body>
</html>
